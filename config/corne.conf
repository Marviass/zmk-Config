# Мышь и скролл с клавиатуры (нужно для &mkp, &mmv, &msc)
CONFIG_ZMK_POINTING=y

# Энергосбережение
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1980000
CONFIG_ZMK_PM_SOFT_OFF=y

# Мощность Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Имя клавиатуры
CONFIG_ZMK_KEYBOARD_NAME="Odyz Corne"

# ZMK Studio
CONFIG_ZMK_STUDIO=y
